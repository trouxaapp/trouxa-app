# No Windows, se o PATH da máquina tiver aspa em algum caminho, o worker de
# teste do Gradle morre antes de rodar (ver tools/build.ps1). No Windows use
# `.\tools\build.ps1 <tarefas>`; no Linux/CI o gradlew normal serve.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
